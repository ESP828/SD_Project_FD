# 운영 배포용 예시 파일입니다. 실제 비밀값은 환경변수나 별도 비밀 저장소에서 주입합니다.
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET}
oauth.state-secret=${OAUTH_STATE_SECRET}
app.oauth-success-uri=${OAUTH_SUCCESS_URI}
app.security.secure-cookies=true

kakao.rest-api-key=${KAKAO_REST_API_KEY}
kakao.client-secret=${KAKAO_CLIENT_SECRET}
kakao.redirect-uri=${KAKAO_REDIRECT_URI}
kakao.maps.javascript-key=${KAKAO_MAPS_JAVASCRIPT_KEY}

naver.client-id=${NAVER_CLIENT_ID}
naver.client-secret=${NAVER_CLIENT_SECRET}
naver.redirect-uri=${NAVER_REDIRECT_URI}

google.client-id=${GOOGLE_CLIENT_ID}
google.client-secret=${GOOGLE_CLIENT_SECRET}
google.redirect-uri=${GOOGLE_REDIRECT_URI}

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

recommendation.python.executable=${PYTHON_EXECUTABLE}
recommendation.python.script=${PYTHON_SCRIPT_PATH}
