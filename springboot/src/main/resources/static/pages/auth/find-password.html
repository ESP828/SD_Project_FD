<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="푸드덕 비밀번호 찾기">
  <title>비밀번호 찾기 · 푸드덕</title>
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/common.css?v=20260826-pagination-v1">
  <link rel="stylesheet" href="/pages/auth/auth.css">
</head>
<body>
  <div data-site-header></div>

  <main class="auth-page">
    <div class="auth-shell">
      <aside class="auth-visual" aria-label="푸드덕 비밀번호 찾기 안내">
        <div class="auth-visual-copy">
          <h2>비밀번호가<br>기억나지 않나요?</h2>
        </div>
        <img src="/images/characters/waving.png" alt="" aria-hidden="true">
      </aside>

      <section class="auth-card" aria-labelledby="find-password-title">
        <h1 id="find-password-title">비밀번호 찾기</h1>
        <p></p>

        <form id="find-password-form" class="auth-form">
          <label class="field">
            아이디
            <input type="text" name="loginId" id="find-password-login-id" placeholder="아이디를 입력해 주세요" autocomplete="username" maxlength="50" required>
          </label>
          <label class="field">
            이메일
            <div class="field-row">
              <input type="email" name="email" id="find-password-email" placeholder="가입 시 등록한 이메일" autocomplete="email" maxlength="254" required>
              <button type="button" class="button button-secondary button-sm field-action" id="send-code-btn">인증코드 발송</button>
            </div>
          </label>
          <label class="field">
            <span>인증번호 <span class="field-hint">숫자 6자리, 5분 이내 입력</span></span>
            <div class="field-row">
              <input type="text" name="verificationCode" id="find-password-code" placeholder="이메일로 받은 인증번호" inputmode="numeric" pattern="^[0-9]{6}$" maxlength="6" required>
              <button type="button" class="button button-secondary button-sm field-action" id="verify-code-btn">임시 비밀번호 발급</button>
            </div>
            <p class="field-status" id="email-verify-status"></p>
          </label>
        </form>
        <p id="find-password-message" class="auth-message" role="alert"></p>

        <p class="auth-switch">
          <a href="/auth/find-id">아이디 찾기</a>
          <span id="go-change-password-wrap" hidden> · <a href="/auth/login?next=%2Fpages%2Fmypage%2Findex.html">지금 로그인해서 변경하기</a></span>
          ·
          <a href="/auth/login">로그인으로 돌아가기</a>
        </p>
      </section>
    </div>
  </main>

  <div data-site-footer></div>

  <script src="/js/api.js"></script>
  <script src="/js/common.js?v=20260826-pagination-v1"></script>
  <script src="/pages/auth/find-password.js"></script>
</body>
</html>
