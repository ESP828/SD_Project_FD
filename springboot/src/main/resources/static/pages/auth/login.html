<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="푸드덕 로그인">
  <title>로그인 · 푸드덕</title>
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/common.css?v=20260826-pagination-v1">
  <link rel="stylesheet" href="/pages/auth/auth.css">
</head>
<body>
  <div data-site-header></div>

  <main class="auth-page">
    <div class="auth-shell">
      <aside class="auth-visual" aria-label="푸드덕 로그인 안내">
        <div class="auth-visual-copy">
          <h2>다시 만나서<br>반가워요!</h2>
        </div>
        <img src="/images/characters/waving.png" alt="" aria-hidden="true">
      </aside>

      <section class="auth-card" aria-labelledby="login-title">
        <h1 id="login-title">로그인</h1>
        <p></p>
        <form id="login-form" class="auth-form">
          <label class="field">
            아이디
            <input type="text" name="loginId" placeholder="아이디를 입력해 주세요" autocomplete="username" maxlength="50" required>
          </label>
          <label class="field">
            비밀번호
            <input type="password" name="password" placeholder="비밀번호를 입력해 주세요" autocomplete="current-password" maxlength="128" required>
          </label>
          <div class="auth-options">
            <label class="remember-check">
              <input type="checkbox" name="rememberLogin">
              로그인 상태 유지
            </label>
            <span class="account-find-links">
              <a href="/auth/find-id">아이디 찾기</a>
              <a href="/auth/find-password">비밀번호 찾기</a>
            </span>
          </div>
          <button class="button button-primary auth-submit" type="submit">
            <span class="material-symbols-rounded" aria-hidden="true">login</span>
            로그인
          </button>
        </form>
        <p id="login-message" class="auth-message" role="alert"></p>

        <div class="auth-divider"><span>소셜 계정으로 계속하기</span></div>
        <div class="social-login-list">
          <a class="social-button social-kakao" href="/api/auth/kakao/login">
            <img class="social-icon-img" src="/images/social/kakao_icon.png" alt="" aria-hidden="true">
            <span>카카오 로그인</span>
          </a>
          <a class="social-button social-naver" href="/api/auth/naver/login">
            <img class="social-icon-img" src="/images/social/naver_icon.png" alt="" aria-hidden="true">
            <span>네이버 로그인</span>
          </a>
          <a class="gsi-material-button" href="/api/auth/google/login">
            <div class="gsi-material-button-state"></div>
            <div class="gsi-material-button-content-wrapper">
              <div class="gsi-material-button-icon">
                <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" xmlns:xlink="http://www.w3.org/1999/xlink" style="display: block;">
                  <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                  <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                  <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                  <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
                  <path fill="none" d="M0 0h48v48H0z"></path>
                </svg>
              </div>
              <span class="gsi-material-button-contents">Google 로그인</span>
            </div>
          </a>
        </div>

        <p class="auth-switch">
          푸드덕이 처음이신가요?
          <a href="/auth/signup">회원가입</a>
        </p>
      </section>
    </div>
  </main>

  <div data-site-footer></div>

  <script src="/js/api.js"></script>
  <script src="/js/common.js?v=20260826-pagination-v1"></script>
  <script src="/pages/auth/login.js"></script>
</body>
</html>
