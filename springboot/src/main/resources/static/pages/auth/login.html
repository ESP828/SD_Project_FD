<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="푸드덕 로그인">
  <title>로그인 · 푸드덕</title>
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/pages/auth/auth.css">
</head>
<body>
  <div data-site-header></div>

  <main class="auth-page">
    <div class="auth-shell">
      <aside class="auth-visual" aria-label="푸드덕 로그인 안내">
        <div class="auth-visual-copy">
          <p class="eyebrow">Welcome back</p>
          <h2>다시 만나서<br>반가워요!</h2>
        </div>
        <img src="/images/characters/waving.png" alt="" aria-hidden="true">
      </aside>

      <section class="auth-card" aria-labelledby="login-title">
        <p class="page-kicker">Member login</p>
        <h1 id="login-title">로그인</h1>
        <p class="auth-intro">푸드덕 계정으로 안전하게 로그인합니다.</p>

        <form id="login-form" class="auth-form">
          <label class="field">
            아이디
            <input type="text" name="loginId" placeholder="아이디를 입력해 주세요" autocomplete="username" maxlength="50" required>
          </label>
          <label class="field">
            비밀번호
            <input type="password" name="password" placeholder="비밀번호를 입력해 주세요" autocomplete="current-password" maxlength="128" required>
          </label>
          <div class="auth-options">
            <label class="remember-check">
              <input type="checkbox" name="rememberLogin">
              로그인 상태 유지
            </label>
            <span>계정 찾기 기능은 연결 예정</span>
          </div>
          <button class="button button-primary auth-submit" type="submit">
            <span class="material-symbols-rounded" aria-hidden="true">login</span>
            로그인
          </button>
        </form>
        <p id="login-message" class="auth-message" role="alert"></p>

        <div class="auth-divider"><span>소셜 계정으로 계속하기</span></div>
        <div class="social-login-list">
          <a class="social-button social-kakao" href="/api/auth/kakao/login">
            <span class="social-symbol" aria-hidden="true">K</span>
            카카오로 계속하기
          </a>
          <a class="social-button social-naver" href="/api/auth/naver/login">
            <span class="social-symbol" aria-hidden="true">N</span>
            네이버로 계속하기
          </a>
          <a class="social-button social-google" href="/api/auth/google/login">
            <span class="social-symbol" aria-hidden="true">G</span>
            Google로 계속하기
          </a>
        </div>

        <p class="auth-switch">
          푸드덕이 처음이신가요?
          <a href="/pages/auth/signup.html">회원가입</a>
        </p>
      </section>
    </div>
  </main>

  <div data-site-footer></div>

  <script src="/js/api.js"></script>
  <script src="/js/common.js"></script>
  <script src="/pages/auth/login.js"></script>
</body>
</html>
