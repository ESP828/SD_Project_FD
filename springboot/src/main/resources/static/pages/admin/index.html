<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="푸드덕 관리자 운영 화면">
  <title>관리자 페이지 · 푸드덕</title>
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/common.css?v=20260826-pagination-v1">
  <link rel="stylesheet" href="/pages/management/management.css">
  <link rel="stylesheet" href="/pages/mypage/mypage.css">
</head>
<body>
  <div data-site-header data-active-nav="admin"></div>

  <main class="mypage-main">
    <section class="mypage-hero">
      <div class="container mypage-hero-grid">
        <div>
          <h1>관리자 페이지</h1>
        </div>
        <img src="/images/characters/laptop-search-no-logo.png" alt="" aria-hidden="true">
      </div>
    </section>

    <section id="admin-content" class="container mypage-content" aria-live="polite">
      <section id="admin-access-gate" class="mypage-gate" hidden>
        <img src="/images/characters/error.png" alt="" aria-hidden="true">
        <div>
          <h2>관리자 권한이 필요합니다</h2>
          <p>이 페이지는 계정 권한 코드 ROLE_ADMIN이 확인된 사용자만 이용할 수 있습니다.</p>
          <div class="mypage-gate-actions">
            <a class="button button-navy" href="/mypage">마이 페이지</a>
            <a class="button button-secondary" href="/">홈</a>
          </div>
        </div>
      </section>

      <section id="admin-dashboard" hidden>
        <div id="admin-loading" class="mypage-loading">
          <span class="material-symbols-rounded" aria-hidden="true">progress_activity</span>
          <strong>관리자 정보를 불러오고 있습니다.</strong>
        </div>
        <div id="admin-profile-host"></div>
        <div id="admin-overview-error"></div>
        <div id="admin-overview-content" hidden>
          <section id="admin-metrics" class="activity-grid activity-grid--admin"></section>
          <div class="mypage-layout">
            <section id="admin-pending-panel" class="mypage-panel"></section>
            <aside class="mypage-side-stack">
              <section id="admin-action-panel" class="mypage-side-panel"></section>
              <section id="admin-status-panel" class="mypage-side-panel"></section>
            </aside>
          </div>
        </div>
      </section>
    </section>
  </main>

  <div data-site-footer></div>
  <script src="/js/api.js"></script>
  <script src="/js/common.js?v=20260826-pagination-v1"></script>
  <script src="/pages/admin/admin.js"></script>
</body>
</html>
