<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="푸드덕 커뮤니티 게시글 상세">
  <title>커뮤니티 이야기 · 푸드덕</title>
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/pages/board/board.css?v=20260820-author-scroll-v1">
</head>
<body class="board-detail-page">
  <div data-site-header data-active-nav="board"></div>

  <main class="board-page-main">
    <section class="board-detail-header">
      <div class="container">
        <a id="detail-list-link" class="board-back-link" href="/board">
          <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
          커뮤니티 목록
        </a>
      </div>
    </section>

    <section class="container board-detail-layout" aria-label="게시글 상세">
      <div class="board-detail-column">
        <article id="post-detail-content" class="board-detail-card" aria-live="polite">
          <div class="board-loading">
            <span class="material-symbols-rounded" aria-hidden="true">progress_activity</span>
            게시글을 불러오고 있습니다.
          </div>
        </article>

        <section class="comment-section board-comments-card" aria-labelledby="comment-heading">
          <div class="comment-heading-row">
            <h2 id="comment-heading">댓글 <span id="detail-comment-count">0</span></h2>
            <button id="comment-write-shortcut" class="comment-write-shortcut" type="button">
              <span class="material-symbols-rounded" aria-hidden="true">edit</span>
              댓글 쓰기
            </button>
          </div>

          <div id="comment-list" class="comment-list" aria-live="off"></div>
          <nav id="comment-pagination" class="comment-pagination" aria-label="댓글 페이지" hidden></nav>
          <p id="comment-load-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>

          <form id="comment-form" class="comment-form comment-form--bottom">
            <div class="comment-form-heading">
              <strong>댓글 작성</strong>
              <span>이야기를 읽고 의견을 남겨 보세요.</span>
            </div>
            <label class="sr-only" for="comment-content">댓글 내용</label>
            <textarea id="comment-content" maxlength="1000" rows="4"
                      aria-describedby="comment-input-hint"
                      placeholder="맛있는 이야기에 댓글을 남겨 보세요."></textarea>
            <div id="comment-input-hint" class="comment-input-meta">
              <span>Enter로 등록 · Shift + Enter로 줄바꿈</span>
              <span id="comment-character-count" class="comment-character-count">0 / 1000</span>
            </div>
            <div class="comment-image-tools">
              <input id="comment-image-input" class="sr-only" type="file"
                     accept=".jpg,.jpeg,.png,.gif,.webp,image/jpeg,image/png,image/gif,image/webp">
              <button id="comment-image-select" class="comment-image-select" type="button">
                사진 첨부
              </button>
              <button id="comment-emoji-toggle" class="comment-emoji-toggle" type="button"
                      aria-expanded="false" aria-controls="comment-emoji-panel">
                😀 이모지
              </button>
              <span>사진 1장 · 최대 5MB</span>
            </div>
            <div id="comment-emoji-panel" class="comment-emoji-panel"
                 role="group" aria-label="이모지 선택" hidden></div>
            <div id="comment-image-preview" class="comment-image-preview" hidden>
              <img id="comment-image-preview-image" alt="댓글 첨부 사진 미리보기">
              <div class="comment-image-preview-copy">
                <strong id="comment-image-preview-name"></strong>
                <span id="comment-image-preview-size"></span>
              </div>
              <button id="comment-image-remove" class="comment-image-remove" type="button">
                선택 취소
              </button>
            </div>
            <div class="comment-submit-row">
              <p id="comment-login-note"></p>
              <button class="button button-sm button-primary" type="submit">댓글 등록</button>
            </div>
          </form>
        </section>
      </div>

      <aside class="detail-side-stack">
        <section class="detail-side-card detail-side-list-card" aria-labelledby="related-post-heading">
          <div class="board-panel-header">
            <div>
              <h3 id="related-post-heading">함께 보면 좋은 글</h3>
              <p>현재 글과 가까운 게시글</p>
            </div>
          </div>
          <ol id="related-post-list" class="best-post-list">
            <li class="best-loading">불러오는 중</li>
          </ol>
        </section>
        <section class="detail-side-card detail-side-list-card" aria-labelledby="detail-unanswered-heading">
          <div class="board-panel-header">
            <div>
              <h3 id="detail-unanswered-heading">답변을 기다려요</h3>
              <p>아직 댓글이 없는 질문</p>
            </div>
          </div>
          <ol id="detail-unanswered-post-list" class="best-post-list">
            <li class="best-loading">불러오는 중</li>
          </ol>
        </section>
        <section id="detail-restaurant-side" class="detail-side-card" hidden></section>
        <section class="detail-side-card">
          <img src="/images/characters/review.png" alt="" aria-hidden="true">
          <h2>맛있는 대화를 이어가세요</h2>
          <p>작성자 아이디와 회원 구분을 확인하고 서로를 존중하는 댓글을 남겨 주세요.</p>
        </section>
      </aside>
    </section>
  </main>

  <div id="board-toast" class="board-toast" role="status" aria-live="polite" hidden></div>
  <div data-site-footer></div>

  <script src="/js/api.js"></script>
  <script src="/js/common.js"></script>
  <script src="/pages/board/board-shared.js"></script>
  <script src="/pages/board/detail.js"></script>
</body>
</html>
