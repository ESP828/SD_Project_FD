<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="푸드덕 사업자 음식점 등록 및 수정">
  <title>음식점 등록 · 사업자 페이지 · 푸드덕</title>
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/pages/management/management.css">
  <link rel="stylesheet" href="/pages/mypage/detail.css">
  <link rel="stylesheet" href="/pages/business/restaurant-form.css">
</head>
<body>
  <div data-site-header data-active-nav="business"></div>

  <main class="mypage-detail-page">
    <section class="mypage-detail-hero">
      <div class="container">
        <a class="mypage-detail-back" href="/business">← 사업자 페이지</a>
        <p class="eyebrow">Restaurant management</p>
        <h1 id="restaurant-form-title">음식점 등록</h1>
        <p id="restaurant-form-description">로그인한 사업자 계정의 음식점을 등록합니다.</p>
      </div>
    </section>

    <section id="restaurant-form-gate" class="container mypage-detail-gate" hidden>
      <img src="/images/characters/waving.png" alt="" aria-hidden="true">
      <div>
        <h2 id="restaurant-form-gate-title">사업자 권한이 필요합니다</h2>
        <p id="restaurant-form-gate-copy">사업자 페이지에서 권한 상태를 확인해 주세요.</p>
        <a id="restaurant-form-gate-link" class="button button-navy" href="/business">사업자 페이지</a>
      </div>
    </section>

    <section id="restaurant-form-content" class="container restaurant-form-content" aria-live="polite">
      <div id="restaurant-form-loading" class="mypage-detail-loading">
        <span class="material-symbols-rounded" aria-hidden="true">progress_activity</span>
        <strong>음식점 정보를 준비하고 있습니다.</strong>
      </div>

      <section id="restaurant-form-panel" class="restaurant-form-panel" hidden>
        <form id="restaurant-form" class="restaurant-management-form">
          <div class="restaurant-form-grid">
            <label>
              <span>가게 이름 *</span>
              <input name="name" type="text" maxlength="100" required autocomplete="organization">
            </label>
            <label>
              <span>카테고리</span>
              <select name="categoryId">
                <option value="">카테고리 미지정</option>
              </select>
            </label>
            <label class="full">
              <span>주소 *</span>
              <input name="address" type="text" maxlength="255" required autocomplete="street-address">
            </label>
            <p id="restaurant-coordinate-status" class="restaurant-coordinate-status full">
              주소를 입력하면 저장 전에 지도 좌표를 자동으로 확인합니다.
            </p>
            <label class="full">
              <span>상세 주소</span>
              <input name="addressDetail" type="text" maxlength="255">
            </label>
            <label>
              <span>전화번호</span>
              <input name="phone" type="tel" maxlength="30" autocomplete="tel">
            </label>
            <label>
              <span>휴무일</span>
              <input name="closedDays" type="text" maxlength="255" placeholder="예: 매주 월요일">
            </label>
            <label class="full">
              <span>영업시간</span>
              <input name="openingHours" type="text" maxlength="500" placeholder="예: 11:00 - 22:00">
            </label>
            <label class="full">
              <span>가게 소개</span>
              <textarea name="description" rows="6" maxlength="2000"></textarea>
            </label>
          </div>

          <p id="restaurant-form-status" class="restaurant-form-status" role="status"></p>
          <div class="restaurant-form-actions">
            <a class="button button-secondary" href="/business/detail?tab=restaurants">취소</a>
            <button id="restaurant-form-submit" class="button button-primary" type="submit">등록하기</button>
          </div>
        </form>
      </section>
    </section>
  </main>

  <div data-site-footer></div>
  <script src="/js/api.js"></script>
  <script src="/js/common.js"></script>
  <script src="/pages/business/restaurant-form.js"></script>
</body>
</html>
