<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="푸드덕 사업자 권한 신청과 음식점 관리">
  <title>사업자 관리 · 푸드덕</title>
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/pages/management/management.css">
  <link rel="stylesheet" href="/pages/mypage/mypage.css">
</head>
<body>
  <div data-site-header data-active-nav="business"></div>

  <main class="mypage-main">
    <section class="mypage-hero">
      <div class="container mypage-hero-grid">
        <div>
          <p class="eyebrow">Business center</p>
          <h1>내 가게와 소식을<br>한곳에서 관리하세요</h1>
        </div>
        <img src="/images/characters/cooking.png" alt="" aria-hidden="true">
      </div>
    </section>

    <section id="business-content" class="container mypage-content" aria-live="polite">
      <div id="business-loading" class="mypage-loading">
        <span class="material-symbols-rounded" aria-hidden="true">progress_activity</span>
        <strong>사업자 정보를 불러오고 있습니다.</strong>
      </div>

      <section id="business-login-gate" class="mypage-gate" hidden>
        <img src="/images/characters/waving.png" alt="" aria-hidden="true">
        <div>
          <h2>로그인이 필요합니다</h2>
          <p>일반 회원으로 로그인하면 사업자 권한 신청 화면을 확인할 수 있습니다.</p>
          <div class="mypage-gate-actions">
            <a class="button button-navy" href="/pages/auth/login.html?next=%2Fpages%2Fbusiness%2Findex.html">로그인</a>
          </div>
        </div>
      </section>

      <div id="business-profile-host"></div>

      <section id="business-application" hidden>
        <section id="business-application-metrics" class="activity-grid activity-grid--business-applications"></section>
        <div class="mypage-layout">
          <section class="mypage-panel">
            <div class="mypage-panel-header">
              <div>
                <h3>사업자 권한 신청</h3>
                <p>사업자 정보를 제출하고 관리자 승인 결과를 확인합니다.</p>
              </div>
            </div>
            <div class="management-panel-body">
              <form class="application-form">
                <label>사업자명<input name="businessName" type="text" disabled placeholder="사업자명"></label>
                <label>사업자등록번호<input name="businessNumber" type="text" disabled placeholder="000-00-00000" inputmode="numeric"></label>
                <label>대표자명<input name="representativeName" type="text" disabled placeholder="대표자명"></label>
                <label>개업일자<input name="openedAt" type="date" disabled></label>
                <label>연락처<input name="contact" type="tel" disabled placeholder="010-0000-0000"></label>
                <label class="full">신청 사유<textarea name="reason" rows="3" disabled placeholder="신청 사유"></textarea></label>
                <button class="button button-primary full" type="submit" disabled>신청 제출</button>
              </form>
            </div>
          </section>
          <aside class="mypage-side-stack">
            <section class="mypage-side-panel">
              <div class="mypage-panel-header">
                <div>
                  <h3>신청 내역</h3>
                  <p>최근 신청과 처리 상태</p>
                </div>
              </div>
              <div id="business-application-history" class="management-preview-list management-preview-list--compact"></div>
            </section>
            <section class="mypage-side-panel">
              <a id="business-application-status" class="notification-summary" href="#business-application-history">
                <img src="/images/characters/notification.png" alt="" aria-hidden="true">
                <div>
                  <strong>신청 상태 확인 중</strong>
                  <span>신청 내역을 불러오고 있습니다.</span>
                </div>
              </a>
            </section>
          </aside>
        </div>
      </section>

      <section id="business-dashboard" hidden>
        <section id="business-metrics" class="activity-grid activity-grid--business"></section>
        <div class="mypage-layout">
          <section id="business-restaurant-panel" class="mypage-panel"></section>
          <aside class="mypage-side-stack">
            <section id="business-action-panel" class="mypage-side-panel"></section>
            <section id="business-status-panel" class="mypage-side-panel"></section>
          </aside>
        </div>
      </section>
    </section>
  </main>

  <div data-site-footer></div>
  <script src="/js/api.js"></script>
  <script src="/js/common.js"></script>
  <script src="/pages/business/business.js"></script>
</body>
</html>
