<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="상황과 취향에 맞춰 골라 보는 푸드덕 맛집 프리셋">
  <title>Presset · 푸드덕</title>
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/common.css?v=20260827-nav-drawer-v11">
  <link rel="stylesheet" href="/pages/presset/presset.css">
</head>
<body>
  <div data-site-header data-active-nav="presset"></div>

  <main class="preset-main">
    <section class="preset-hero">
      <div class="container preset-hero-grid">
        <div>
          <p class="eyebrow">PRESSET COLLECTION</p>
          <h1>고민할 필요 없이,<br>상황에 맞는 맛집 모음</h1>
          <p class="preset-hero-copy">
            데이트부터 가족 모임, 혼밥까지. 푸드덕이 골라 담은 테마별 음식점을 만나보세요.
          </p>
          <div class="preset-hero-actions">
            <a class="button button-primary" href="#preset-collection">모음 둘러보기</a>
            <a
              class="button button-secondary"
              href="/presset/register"
              data-preset-register-link
            >프리셋 등록</a>
          </div>
        </div>
        <img src="/images/characters/cooking.png" alt="" aria-hidden="true">
      </div>
    </section>

    <section id="preset-collection" class="container preset-collection">
      <div class="preset-section-heading">
        <div>
          <h2>지금 어울리는 맛집 모음</h2>
          <p id="preset-count" class="muted">프리셋을 불러오고 있습니다.</p>
        </div>
        <a class="button button-secondary" href="/map">맛집 지도</a>
      </div>

      <div class="preset-toolbar surface-card">
        <form id="preset-search-form" class="preset-search" role="search">
          <label class="sr-only" for="preset-keyword">Presset 검색</label>
          <input id="preset-keyword" type="search" maxlength="100" placeholder="지역, 상황, Presset 이름 검색">
          <button class="button button-primary" type="submit">검색</button>
        </form>
        <label class="preset-sort-label" for="preset-sort">
          정렬
          <select id="preset-sort">
            <option value="popular">인기순</option>
            <option value="latest">최신순</option>
            <option value="favorite">저장순</option>
          </select>
        </label>
      </div>

      <div id="preset-filters" class="preset-filters preset-filters--wide" aria-label="상황별 Presset 필터"></div>

      <div
        id="preset-list"
        class="preset-list"
        role="status"
        aria-live="polite"
        aria-busy="true"
      >
        <div class="preset-state">
          <span class="preset-spinner" aria-hidden="true"></span>
          <strong>맛집 모음을 준비하고 있습니다.</strong>
        </div>
      </div>
      <nav id="preset-pagination" class="preset-pagination" aria-label="Presset 페이지"></nav>
    </section>
  </main>

  <div id="preset-toast" class="preset-toast" role="status" aria-live="polite" hidden></div>
  <div data-site-footer></div>

  <script src="/js/api.js"></script>
  <script src="/js/common.js?v=20260827-nav-drawer-v11"></script>
  <script src="/pages/presset/presset.js"></script>
 </body>
</html>
