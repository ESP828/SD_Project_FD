<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="상황과 취향에 맞춰 골라 보는 푸드덕 맛집 보물지도">
  <title>보물지도 · 푸드덕</title>
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/pages/presset/presset.css">
</head>
<body>
  <div data-site-header data-active-nav="presset"></div>

  <main class="preset-main">
    <section class="preset-hero">
      <div class="container preset-hero-grid">
        <div>
          <p class="eyebrow">treasuremap collections</p>
          <h1>나의 취향을<br>선택해놓은 맛집</h1>
          <div class="preset-hero-actions">
            <a class="button button-primary" href="#preset-collection">모음 둘러보기</a>
            <a
              class="button button-secondary"
              href="/pages/presset/register.html"
              data-preset-register-link
            >보물지도 등록</a>
          </div>
        </div>
        <img src="/images/characters/cooking.png" alt="" aria-hidden="true">
      </div>
    </section>

    <section id="preset-collection" class="container preset-collection">
      <div class="preset-section-heading">
        <div>
          <p class="eyebrow">CURATED FOR YOU</p>
          <h2>취향별 보물지도를 둘러보세요</h2>
          <p id="preset-count" class="muted">보물지도를 불러오고 있습니다.</p>
        </div>
      </div>

      <div id="preset-search-panel" class="preset-discovery-panel surface-card">
        <div class="preset-discovery-main">
          <form id="preset-search-form" class="preset-search" role="search">
            <label class="sr-only" for="preset-keyword">보물지도 검색</label>
            <div class="preset-search-field">
              <span class="preset-search-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <circle cx="11" cy="11" r="6.5"></circle>
                  <path d="m16 16 4 4"></path>
                </svg>
              </span>
              <input
                id="preset-keyword"
                type="search"
                maxlength="100"
                placeholder="지역, 상황, 키워드로 보물지도 검색"
              >
            </div>
            <button class="button button-primary preset-search-submit" type="submit">검색</button>
          </form>

          <div class="preset-toolbar-actions" aria-label="보물지도 보기 옵션">
            <label class="preset-sort-label" for="preset-sort">
              <span>정렬</span>
              <select id="preset-sort">
                <option value="popular">인기순</option>
                <option value="latest">최신순</option>
                <option value="favorite">저장순</option>
              </select>
            </label>
            <button
              id="preset-filter-toggle"
              class="button button-ghost preset-filter-toggle"
              type="button"
              aria-controls="preset-filter-panel"
              aria-expanded="true"
            >
              <span aria-hidden="true">☷</span>
              <span data-filter-toggle-text>상세 조건 접기</span>
            </button>
          </div>
        </div>

        <div id="preset-filter-panel" class="preset-filter-panel">
          <div id="preset-filters" class="preset-filters preset-filters--wide" aria-label="상황별 보물지도 필터"></div>
        </div>
      </div>

      <div
        id="preset-list"
        class="preset-list"
        role="status"
        aria-live="polite"
        aria-busy="true"
      >
        <div class="preset-state">
          <span class="preset-spinner" aria-hidden="true"></span>
          <strong>맛집 모음을 준비하고 있습니다.</strong>
        </div>
      </div>
      <nav id="preset-pagination" class="preset-pagination" aria-label="보물지도 페이지"></nav>
    </section>
  </main>

  <div id="preset-toast" class="preset-toast" role="status" aria-live="polite" hidden></div>
  <div data-site-footer></div>

  <script src="/js/api.js"></script>
  <script src="/js/common.js"></script>
  <script src="/pages/presset/presset.js"></script>
</body>
</html>
