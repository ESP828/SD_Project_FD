<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="상황과 취향에 맞춰 골라 보는 푸드덕 맛집 보물지도">
  <title>보물지도 · 푸드덕</title>
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/pages/presset/presset.css">
  <link rel="stylesheet" href="/css/category-hero.css">
</head>
<body>
  <div data-site-header data-active-nav="presset"></div>

  <main class="preset-main">
    <section class="preset-hero category-hero category-hero--full">
      <div class="container preset-hero-grid category-hero__inner">
        <div class="category-hero__copy">
          <p class="eyebrow">treasuremap collections</p>
          <h1>나의 취향을<br>선택해놓은 맛집</h1>
          <div class="preset-hero-actions">
            <a
              class="button button-primary"
              href="/presset/register"
              data-preset-register-link
            >
              <span class="material-symbols-rounded" aria-hidden="true">edit</span>
              보물지도 등록
            </a>
          </div>
        </div>
        <div class="category-hero__visual">
          <img class="category-hero__image" src="/images/characters/treasure-map-hero.png"
               alt="" aria-hidden="true" decoding="async" fetchpriority="high">
        </div>
      </div>
    </section>

    <section id="preset-collection" class="container preset-collection">
      <div class="preset-section-heading">
        <div>
          <p class="eyebrow">CURATED FOR YOU</p>
          <h2>취향별 보물지도를 둘러보세요</h2>
          <p id="preset-count" class="muted">보물지도를 불러오고 있습니다.</p>
        </div>
      </div>

      <div id="preset-view-tabs" class="preset-view-tabs" role="tablist" aria-label="보물지도 보기 방식">
        <button
          id="preset-view-all"
          class="preset-view-tab is-active"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="preset-list"
          data-preset-sort="latest"
        >전체 보물지도</button>
        <button
          id="preset-view-popular"
          class="preset-view-tab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="preset-list"
          data-preset-sort="popular"
        >인기 보물지도</button>
        <button
          id="preset-view-best"
          class="preset-view-tab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="preset-list"
          data-preset-sort="favorite"
        >베스트 보물지도</button>
      </div>

      <div id="preset-search-panel" class="preset-discovery-panel surface-card">
        <div class="preset-discovery-main">
          <form id="preset-search-form" class="preset-search" role="search">
            <label class="preset-search-select">
              <span class="sr-only">태그 선택</span>
              <select id="preset-tag-select" aria-label="보물지도 태그 선택">
                <option value="">태그 전체</option>
              </select>
            </label>
            <label class="preset-search-field">
              <span class="material-symbols-rounded" aria-hidden="true">search</span>
              <span class="sr-only">보물지도 제목 또는 태그 검색</span>
              <input
                id="preset-keyword"
                type="search"
                maxlength="100"
                autocomplete="off"
                placeholder="제목 또는 태그 검색 (예: 성수, 데이트)"
              >
            </label>
            <label class="preset-search-select">
              <span class="sr-only">보물지도 정렬</span>
              <select id="preset-sort-select" aria-label="보물지도 정렬">
                <option value="latest">최신순</option>
                <option value="popular">인기순</option>
                <option value="favorite">찜 많은 순</option>
              </select>
            </label>
            <button class="button button-sm button-navy preset-search-submit" type="submit">검색</button>
            <button
              id="preset-search-reset"
              class="button button-sm button-secondary preset-search-reset"
              type="button"
            >초기화</button>
          </form>

        </div>
      </div>

      <div class="preset-list-toolbar">
        <a
          class="button button-sm button-primary"
          href="/presset/register"
          data-preset-register-link
        >
          <span class="material-symbols-rounded" aria-hidden="true">edit</span>
          보물지도 등록
        </a>
      </div>

      <div
        id="preset-list"
        class="preset-list"
        role="status"
        aria-live="polite"
        aria-busy="true"
      >
        <div class="preset-state">
          <span class="preset-spinner" aria-hidden="true"></span>
          <strong>맛집 모음을 준비하고 있습니다.</strong>
        </div>
      </div>
      <nav id="preset-pagination" class="preset-pagination" aria-label="보물지도 페이지"></nav>
    </section>
  </main>

  <div id="preset-toast" class="preset-toast" role="status" aria-live="polite" hidden></div>
  <div data-site-footer></div>

  <script src="/js/api.js"></script>
  <script src="/js/common.js"></script>
  <script src="/pages/presset/presset.js"></script>
</body>
</html>
