<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="내 활동 데이터로 확인하는 푸드덕 맛집 추천">
  <title>맛집 추천 · 푸드덕</title>
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/common.css?v=20260827-nav-drawer-v11">
  <link rel="stylesheet" href="/pages/recommendation/recommendation.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="/css/category-hero.css">
</head>
<body>
  <div data-site-header data-active-nav="recommendation"></div>

  <main class="recommendation-main">
    <section class="recommendation-hero category-hero category-hero--full">
      <div class="container recommendation-hero-grid category-hero__inner">
        <div class="category-hero__copy">
          <h1>내 취향을 따라<br>찾아낸 맛있는 선택</h1>
          <div class="recommendation-hero-actions">
            <a class="button button-primary" href="/map">
              <span class="material-symbols-rounded" aria-hidden="true">map</span>
              맛집찾기에서 직접 찾기
            </a>
            <a class="button button-secondary" href="/presset">
              보물지도 둘러보기
            </a>
          </div>
        </div>
        <div class="category-hero__visual">
          <img class="category-hero__image" src="/images/characters/cooking.png" alt="" aria-hidden="true">
        </div>
      </div>
    </section>

    <section id="recommendation-content" class="container recommendation-content" aria-live="polite">
      <div class="recommendation-loading">
        <span class="material-symbols-rounded" aria-hidden="true">progress_activity</span>
        <strong>추천 데이터를 확인하고 있습니다.</strong>
      </div>
    </section>
  </main>

  <div data-site-footer></div>

  <script src="/js/api.js"></script>
  <script src="/js/common.js?v=20260827-nav-drawer-v11"></script>
  <script src="/pages/recommendation/recommendation.js"></script>
</body>
</html>
