<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="푸드덕 비밀번호 변경">
  <title>비밀번호 변경 · 푸드덕</title>
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/common.css?v=20260826-pagination-v1">
  <link rel="stylesheet" href="/pages/auth/auth.css">
  <link rel="stylesheet" href="/pages/mypage/detail.css">
</head>
<body>
  <div data-site-header></div>

  <main class="mypage-detail-page">
    <section class="mypage-detail-hero">
      <div class="container">
        <a class="mypage-detail-back" href="/mypage">← 마이페이지 홈</a>
        <p class="eyebrow">Account settings</p>
        <h1>비밀번호 변경</h1>
        <p>현재 비밀번호를 확인한 뒤 새 비밀번호로 변경합니다.</p>
      </div>
    </section>

    <section id="change-password-gate" class="container mypage-detail-gate" hidden>
      <img src="/images/characters/waving.png" alt="" aria-hidden="true">
      <div>
        <h2>로그인 후 이용해 주세요</h2>
        <p>비밀번호 변경은 로그인한 계정 기준으로 처리됩니다.</p>
        <a id="change-password-login" class="button button-navy" href="/auth/login">로그인</a>
      </div>
    </section>

    <section id="change-password-content" class="container mypage-detail-content">
      <div class="mypage-panel">
        <div class="mypage-panel-header">
          <div>
            <h3>새 비밀번호 설정</h3>
            <p>영문, 숫자, 특수문자를 모두 포함해 8~64자로 입력해 주세요.</p>
          </div>
        </div>
        <form id="change-password-form" class="auth-form mypage-panel-form">
          <label class="field">
            현재 비밀번호
            <input type="password" name="currentPassword" id="current-password" placeholder="현재 비밀번호" autocomplete="current-password" required>
          </label>
          <label class="field">
            새 비밀번호
            <input type="password" name="newPassword" id="new-password" placeholder="새 비밀번호" autocomplete="new-password" minlength="8" maxlength="64" pattern="^(?=.*[A-Za-z])(?=.*\d)(?=.*[^A-Za-z0-9]).+$" data-password-policy required>
          </label>
          <label class="field">
            새 비밀번호 확인
            <input type="password" name="newPasswordConfirm" id="new-password-confirm" placeholder="새 비밀번호 확인" autocomplete="new-password" minlength="8" maxlength="64" required>
            <p class="field-status" id="new-password-confirm-status"></p>
          </label>
          <button type="submit" class="button button-navy auth-submit" id="change-password-submit">비밀번호 변경</button>
          <p id="change-password-message" class="auth-message" role="alert"></p>
        </form>
      </div>
    </section>
  </main>

  <div data-site-footer></div>

  <script src="/js/api.js"></script>
  <script src="/js/common.js?v=20260826-pagination-v1"></script>
  <script src="/pages/mypage/change-password.js"></script>
</body>
</html>
