# 로컬 개발용 예시 파일입니다.
# 실제 사용 시 application-local.properties로 복사하고 비밀값은 커밋하지 않습니다.
# SPRING_PROFILES_ACTIVE=local로 local 프로필을 활성화합니다.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/foodduck?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:fooduck_app}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}
oauth.state-secret=${OAUTH_STATE_SECRET}
app.security.secure-cookies=false
kakao.rest-api-key=${KAKAO_REST_API_KEY:}
kakao.maps.javascript-key=${KAKAO_MAPS_JAVASCRIPT_KEY:}
naver.client-id=${NAVER_CLIENT_ID:}
naver.client-secret=${NAVER_CLIENT_SECRET:}
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
recommendation.python.executable=${PYTHON_EXECUTABLE:python}
recommendation.python.script=${PYTHON_SCRIPT_PATH:}
