spring.application.name=backend
server.port=${SERVER_PORT:8081}

# MySQL 8
# 접속 정보는 실행 환경에서 주입한다.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 스키마는 SQL 마이그레이션이 소유하고 JPA는 매핑만 검증한다.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# 공통 안내·오류 메시지
spring.messages.basename=messages/messages,messages/errors
spring.messages.encoding=UTF-8

# 기존 DB에 V1을 잘못 적용하지 않도록 기본 비활성화한다.
# 비어 있는 새 DB에 설치할 때만 FLYWAY_ENABLED=true로 실행한다.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration

# 인증 비밀값은 저장소에 넣지 않는다.
#jwt.secret=${JWT_SECRET}
jwt.secret=${JWT_SECRET:fooduck_local_development_jwt_secret_key_32bytes_min}
jwt.access-token-validity=${JWT_ACCESS_TOKEN_VALIDITY:1800000}
# 로그인 상태 유지 체크 시 발급하는 리프레시 토큰 유효기간(기본 14일)
jwt.refresh-token-validity=${JWT_REFRESH_TOKEN_VALIDITY:1209600000}

# OAuth 공통
oauth.state-secret=${OAUTH_STATE_SECRET:${JWT_SECRET}}
oauth.state-validity=${OAUTH_STATE_VALIDITY:300000}
oauth.ticket-validity=${OAUTH_TICKET_VALIDITY:120000}
app.oauth-success-uri=${OAUTH_SUCCESS_URI:http://localhost:8081/auth/oauth-callback}
app.security.secure-cookies=${SECURE_COOKIES:false}

# Kakao / Naver / Google 로그인
kakao.rest-api-key=${KAKAO_REST_API_KEY:}
kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8081/api/auth/kakao/callback}
kakao.client-secret=${KAKAO_CLIENT_SECRET:}
naver.client-id=${NAVER_CLIENT_ID:}
naver.client-secret=${NAVER_CLIENT_SECRET:}
naver.redirect-uri=${NAVER_REDIRECT_URI:http://localhost:8081/api/auth/naver/callback}
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8081/api/auth/google/callback}

# Kakao JavaScript SDK 키는 브라우저에서 공개되는 키이며 Kakao 콘솔에서 도메인 제한이 필요하다.
kakao.maps.javascript-key=${KAKAO_MAPS_JAVASCRIPT_KEY:}

# 공공데이터포털 소상공인시장진흥공단 상가업소정보 API
public-data.restaurant.service-key=${PUBLIC_DATA_RESTAURANT_SERVICE_KEY:}

# 국세청 사업자등록정보 진위확인 및 상태조회 API (공공데이터포털)
public-data.business-registration.service-key=${BUSINESS_REGISTRATION_VERIFY_SERVICE_KEY:}

# 리뷰 감성분석(Naive Bayes) FastAPI 서비스. 비어 있으면 감성분석 기능은 조용히 비활성화된다.
sentiment-api.base-url=${SENTIMENT_API_BASE_URL:}

# 이메일 인증번호 발송 (Gmail SMTP + 앱 비밀번호)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=45000
spring.mail.properties.mail.smtp.timeout=45000
spring.mail.properties.mail.smtp.writetimeout=45000
email.verification-code-validity=${EMAIL_VERIFICATION_CODE_VALIDITY:300000}
email.verification-validity=${EMAIL_VERIFICATION_VALIDITY:1800000}

# Spring Boot 정적 화면 외의 클라이언트를 연결할 때 환경변수로 origin을 제한할 수 있다.
# 기본값은 전체 허용(*)이다.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Presset 대표 이미지 업로드 (로컬 디스크 저장 + 정적 리소스로 서빙)
app.upload.preset-image-dir=${PRESET_IMAGE_UPLOAD_DIR:uploads/preset-images}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# AI 임베딩 추천 서비스 (springboot/ai, FastAPI + SentenceTransformer)
# 호출 실패/타임아웃 시 RecommendationService가 기존 TF-IDF 계산으로 자동 폴백한다.
recommendation.ai.base-url=${RECOMMENDATION_AI_BASE_URL:http://127.0.0.1:8000}
recommendation.ai.timeout-ms=${RECOMMENDATION_AI_TIMEOUT_MS:4000}
# springboot/ai/recommend.py의 EMBEDDING_MODEL_NAME과 일치시킨다 (응답 표시용).
recommendation.ai.model-name=${RECOMMENDATION_AI_MODEL_NAME:KURE-v1}

# 추천 엔진 라우팅. KURE 장애 시 동일 후보군을 TF-IDF로만 재점수화한다.
recommendation.engine.primary=KURE
recommendation.engine.fallback=TFIDF
recommendation.engine.gemini.enabled=false
recommendation.candidate-limit=${RECOMMENDATION_CANDIDATE_LIMIT:1000}
recommendation.evidence-candidate-limit=${RECOMMENDATION_EVIDENCE_CANDIDATE_LIMIT:5000}
# 자연어 검색의 KURE 신뢰도 구간.
# 파서가 카테고리 단어를 SQL 필터로 떼어내므로 KURE에 가는 것은 "잔여 텍스트"뿐이다.
#   "조용한 카페" -> "조용한" / "매운 국밥" -> "매운" / "초밥" -> (빈 문자열, FILTER_ONLY)
# 그 잔여 텍스트의 실측 분포는 강남 3km 기준 0.29~0.57이라 아래 구간이 그대로 들어맞는다.
# 이 값을 올리면 "조용한"(max 0.3848) 같은 정상 질의가 통째로 0점 처리되어
# SEMANTIC_EVIDENCE_LOW로 빠지고 결과가 거리순으로만 나온다.
recommendation.semantic.kure-floor=${RECOMMENDATION_KURE_SCORE_FLOOR:0.20}
recommendation.semantic.kure-ceiling=${RECOMMENDATION_KURE_SCORE_CEILING:0.55}
recommendation.semantic.tfidf-floor=${RECOMMENDATION_TFIDF_SCORE_FLOOR:0.0}
recommendation.semantic.tfidf-ceiling=${RECOMMENDATION_TFIDF_SCORE_CEILING:0.25}

# 「나를 위한 맛집」 개인화. 자연어 검색과 달리 상위 N건을 미리 고르는 단계가 없으므로
# 반경 안 매장을 전부 후보로 담은 뒤(personal-candidate-limit) 취향 점수를 매기고,
# 품질/집단 신호와 DTO 생성은 취향 상위 taste-shortlist 건에만 수행한다.
recommendation.personal-candidate-limit=${RECOMMENDATION_PERSONAL_CANDIDATE_LIMIT:20000}
recommendation.personal.taste-shortlist=${RECOMMENDATION_PERSONAL_TASTE_SHORTLIST:300}
# TF-IDF fallback은 후보마다 문서를 새로 만들어야 해서 가까운 순으로 줄여 계산한다.
recommendation.personal.tfidf-candidate-limit=${RECOMMENDATION_PERSONAL_TFIDF_CANDIDATE_LIMIT:2000}
# TF-IDF 취향 점수의 최소 기준. 고정 하한과 "최고 점수 대비 비율" 중 큰 쪽을 컷오프로 쓴다.
recommendation.personal.tfidf-min-score=${RECOMMENDATION_PERSONAL_TFIDF_MIN_SCORE:0.05}
recommendation.personal.tfidf-relative-floor=${RECOMMENDATION_PERSONAL_TFIDF_RELATIVE_FLOOR:0.5}
# 개인화 KURE 취향 점수의 절대 하한. 위 semantic.kure-floor(자연어 검색용)와 분리한다.
# 튜닝 손잡이가 아니라 안전장치다. score_profile이 부정 프로필 유사도를 빼기 때문에
# 점수의 절대 구간이 사용자마다 통째로 움직인다(실측: 부정 신호 없음 0.49~0.80,
# 있음 0.29~0.60). 조금만 올려도 어떤 사용자에게는 후보의 88%가 잘려 나간다.
recommendation.personal.kure-floor=${RECOMMENDATION_PERSONAL_KURE_FLOOR:0.30}
# 같은 브랜드 매장이 결과를 점거하지 않도록 두는 상한.
recommendation.personal.max-per-brand=${RECOMMENDATION_PERSONAL_MAX_PER_BRAND:2}
